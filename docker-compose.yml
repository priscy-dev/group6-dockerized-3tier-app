services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitness_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness_backend
    environment:
      # Local runs use HTTP, so Secure cookies must be disabled. The AWS
      # deployment supplies NODE_ENV=production only after HTTPS is enabled.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 7000
      HOST: 0.0.0.0
      CLIENT_URL: http://localhost:8080
      LOG_PRETTY: "false"
    volumes:
      - ./backend/configs/app_config.json:/run/configs/app_config:ro
      - ./backend/secrets/jwt_private_key:/run/secrets/jwt_private_key:ro
      - ./backend/secrets/jwt_public_key:/run/secrets/jwt_public_key:ro
      - ./backend/secrets/db_username:/run/secrets/db_username:ro
      - ./backend/secrets/db_password:/run/secrets/db_password:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: fitness_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - mongo_data:/data/db
      - ./backend/secrets/db_username:/run/secrets/db_username:ro
      - ./backend/secrets/db_password:/run/secrets/db_password:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
