name: Deploy to production (reusable)

on:
  workflow_call:
    inputs:
      aws_region: { required: true, type: string }
      role_arn: { required: true, type: string }
      application_instance_id: { required: true, type: string }
      application_url: { required: true, type: string }
      frontend_repository: { required: true, type: string }
      backend_repository: { required: true, type: string }
      release_tag: { required: true, type: string }

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy through AWS Systems Manager
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.application_url }}
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Verify release images exist
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          aws ecr describe-images --repository-name '${{ inputs.frontend_repository }}' --image-ids imageTag="$TAG" >/dev/null
          aws ecr describe-images --repository-name '${{ inputs.backend_repository }}' --image-ids imageTag="$TAG" >/dev/null
      - name: Start deployment
        id: command
        env:
          INSTANCE_ID: ${{ inputs.application_instance_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy fitness release $RELEASE_TAG" --parameters "commands=['sudo /usr/local/bin/deploy-fitness-app $RELEASE_TAG']" --query 'Command.CommandId' --output text)
          echo "id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ inputs.application_instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
        run: aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
      - name: Show deployment result
        if: always() && steps.command.outputs.id
        env:
          INSTANCE_ID: ${{ inputs.application_instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
        run: aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
      - name: Verify health and deployed version
        env:
          URL: ${{ inputs.application_url }}
          EXPECTED: ${{ inputs.release_tag }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent "$URL/health" >/dev/null; then break; fi
            sleep 10
          done
          VERSION_JSON=$(curl --fail --silent --show-error "$URL/version")
          ACTUAL=$(echo "$VERSION_JSON" | jq -r .version)
          test "$ACTUAL" = "$EXPECTED" || { echo "Expected $EXPECTED but production reports $ACTUAL" >&2; exit 1; }
          echo "$VERSION_JSON" | jq .
          { echo '## Production deployment'; echo; echo "- Release: \`$ACTUAL\`"; echo "- Application: $URL"; echo "- Version metadata: $URL/version"; } >> "$GITHUB_STEP_SUMMARY"

