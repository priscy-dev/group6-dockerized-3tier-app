name: Build + push images (reusable)

on:
  workflow_call:
    inputs:
      aws_region: { required: true, type: string }
      role_arn: { required: true, type: string }
      frontend_repository: { required: true, type: string }
      backend_repository: { required: true, type: string }
      release_tag: { required: true, type: string }

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and publish immutable images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.frontend_repository }}:${{ inputs.release_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.backend_repository }}:${{ inputs.release_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

