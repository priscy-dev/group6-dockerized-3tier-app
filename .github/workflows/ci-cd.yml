name: Build and deploy three-tier application

on:
  pull_request:
    branches: [main, ci-cd]
  push:
    branches: [main, ci-cd]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: Existing ECR image tag to redeploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fitness-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}

jobs:
  validate:
    name: Validate application
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify backend container build
        run: docker build --file backend/Dockerfile --tag fitness-backend:validation backend

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform/envs/dev fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform -chdir=infrastructure/terraform/envs/dev init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform/envs/dev validate

  build_and_push:
    name: Build and push frontend and backend
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate immutable release tag
        id: release
        shell: bash
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy release through AWS Systems Manager
    needs: build_and_push
    if: |
      always() &&
      ((github.event_name == 'push' && needs.build_and_push.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APPLICATION_URL }}
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          BUILT_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          TAG="${ROLLBACK_TAG:-$BUILT_TAG}"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Start deployment on private application instance
        id: command
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.APPLICATION_INSTANCE_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy fitness release $RELEASE_TAG" \
            --parameters "commands=['sudo /usr/local/bin/deploy-fitness-app $RELEASE_TAG']" \
            --query 'Command.CommandId' \
            --output text)
          echo "id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command
        env:
          INSTANCE_ID: ${{ vars.APPLICATION_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
        run: aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Show deployment result
        env:
          INSTANCE_ID: ${{ vars.APPLICATION_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify public application health
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$APPLICATION_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Application health check failed" >&2
          exit 1

      - name: Read deployed version metadata
        id: metadata
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
        run: |
          VERSION_JSON=$(curl --fail --silent --show-error "$APPLICATION_URL/version")
          echo "json=$VERSION_JSON" >> "$GITHUB_OUTPUT"
          echo "$VERSION_JSON" | jq .

      - name: Publish deployment summary
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          FRONTEND_IMAGE=$(echo "$VERSION_JSON" | jq -r .frontendImage)
          BACKEND_IMAGE=$(echo "$VERSION_JSON" | jq -r .backendImage)
          DEPLOYED_AT=$(echo "$VERSION_JSON" | jq -r .deployedAt)
          {
            echo "## Production deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release | \`$RELEASE_TAG\` |"
            echo "| Frontend | \`$FRONTEND_IMAGE\` |"
            echo "| Backend | \`$BACKEND_IMAGE\` |"
            echo "| Deployed at | $DEPLOYED_AT |"
            echo "| Application | $APPLICATION_URL |"
            echo "| Version endpoint | $APPLICATION_URL/version |"
          } >> "$GITHUB_STEP_SUMMARY"
