# =============================================================================
# Fitness Tracker Frontend -- CI/CD Pipeline
# =============================================================================
# Workflow Stages:
#   validate ---> build-and-push ---> deploy
#
# TRIGGER MATRIX:
#   * Pull request to main or ci-cd: Validate stage only (lint + build check).
#   * Push to main or ci-cd:         Validate -> Build & Push -> Deploy.
#   * Manual run (workflow_dispatch): Deploy only, using a specified git short SHA
#                                    to execute an instant ROLLBACK.
#
# GITHUB SECRETS REQUIRED
#
# Docker Hub
#   DOCKERHUB_USERNAME : Docker Hub username
#   DOCKERHUB_TOKEN    : Docker Hub Personal Access Token
#
# AWS EC2
#   EC2_HOST           : Public IPv4 or Public DNS of the EC2 instance
#   EC2_USER           : SSH username (ubuntu for Ubuntu, ec2-user for Amazon Linux)
#   EC2_SSH_KEY        : Private SSH key (.pem file contents)
#   EC2_SSH_PORT       : Optional (defaults to 22)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, ci-cd]

  pull_request:
    branches: [main, ci-cd]

  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Docker image tag (git short SHA) to deploy"
        required: true
        type: string

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fitness-frontend

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ===========================================================================
  # STAGE 1 - VALIDATE
  # ===========================================================================
  validate:
    name: Lint & Build Frontend
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify production build
        run: npm run build

  # ===========================================================================
  # STAGE 2 - BUILD & PUSH
  # ===========================================================================
  build-and-push:

    name: Build & Push Docker Image

    needs: validate

    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/ci-cd')

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image version
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STAGE 3 - DEPLOY TO AWS EC2
  # ===========================================================================
  deploy:

    name: Deploy to AWS EC2

    needs: build-and-push

    if: >
      always() &&
      (
        (github.event_name == 'push' &&
        needs.build-and-push.result == 'success')
        ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment tag
        id: tag

        run: |
          TAG="${{ github.event.inputs.rollback_tag || needs.build-and-push.outputs.image_tag }}"

          if [ -z "$TAG" ]; then
            echo "::error::No deployment tag supplied."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}

          source: docker-compose.prod.yml
          target: ~/app

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}

          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            mkdir -p ~/app

            cd ~/app

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            export IMAGE_TAG
            export DOCKERHUB_USERNAME

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            echo "$IMAGE_TAG" > CURRENT_VERSION

            docker image prune -f

            docker logout

            echo "===== Current Version ====="

            cat CURRENT_VERSION

            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deployment Smoke Test
        run: |
          for i in $(seq 1 12); do

            if curl -fsS "http://${{ secrets.EC2_HOST }}" >/dev/null; then
              echo "Deployment successful!"
              exit 0
            fi

            echo "Waiting for application..."

            sleep 5

          done

          echo "::error::Deployment failed."

          exit 1